name: Update summary

on:
  push:
    branches: [main]
    paths: ["chats/**", "scripts/**"]
  workflow_dispatch:   # lets you re-run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails the run if anything sensitive is found -> GitHub emails you,
      # and the steps below are skipped, so summary.json is not updated.
      - name: Privacy check
        run: python scripts/privacy_check.py
      - name: Build summary.json
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: python scripts/summarize.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- summary.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary.json
          git commit -m "Update summary.json"
          git push
